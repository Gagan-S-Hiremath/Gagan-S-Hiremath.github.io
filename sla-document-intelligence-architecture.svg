<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="t d"><title id="t">SLA intelligence: two connected capabilities</title><desc id="d">Original document intelligence and Power BI analytics; subsequent retrieval-grounded assistant over SLA content. No live dashboard query connection is represented.</desc><rect width="1200" height="450" rx="12" fill="#17171d"/><text x="20" y="36" fill="#b8b0ff" font-family="Arial,sans-serif" font-size="20">01 · Original capability: document intelligence and analytics</text><rect x="14" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="89" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">SLA</text><text x="89" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">documents</text><text x="169" y="127" fill="#b8b0ff" font-size="20">→</text><rect x="183" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="258" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">OCR &amp; layout</text><text x="258" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">extraction</text><text x="338" y="127" fill="#b8b0ff" font-size="20">→</text><rect x="352" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="427" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">KPI</text><text x="427" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">identification</text><text x="507" y="127" fill="#b8b0ff" font-size="20">→</text><rect x="521" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="596" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Semantic</text><text x="596" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">mapping</text><text x="676" y="127" fill="#b8b0ff" font-size="20">→</text><rect x="690" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="765" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Validation &amp;</text><text x="765" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">human review</text><text x="845" y="127" fill="#b8b0ff" font-size="20">→</text><rect x="859" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="934" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Structured</text><text x="934" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">data</text><text x="1014" y="127" fill="#b8b0ff" font-size="20">→</text><rect x="1028" y="65" width="150" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="1103" y="102" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Power BI</text><text x="1103" y="125" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">dashboards</text><text x="20" y="208" fill="#bdbdc8" font-family="Arial,sans-serif" font-size="16">Approved definitions and source context connect document interpretation with business reporting.</text><text x="20" y="261" fill="#b8b0ff" font-family="Arial,sans-serif" font-size="20">02 · Subsequent enhancement: conversational access to SLA content</text><rect x="20" y="285" width="260" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="150" y="322" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">User question</text><text x="286" y="347" fill="#b8b0ff" font-size="24">→</text><rect x="320" y="285" width="260" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="450" y="322" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Retrieve relevant</text><text x="450" y="345" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">SLA information</text><text x="586" y="347" fill="#b8b0ff" font-size="24">→</text><rect x="620" y="285" width="260" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="750" y="322" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Context-grounded</text><text x="750" y="345" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">answer</text><text x="886" y="347" fill="#b8b0ff" font-size="24">→</text><rect x="920" y="285" width="260" height="108" rx="10" fill="#24232f" stroke="#77718e"/><text x="1050" y="322" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">Response</text><text x="1050" y="345" text-anchor="middle" fill="#f3f1ed" font-family="Arial,sans-serif" font-size="16">to the user</text><text x="20" y="428" fill="#bdbdc8" font-family="Arial,sans-serif" font-size="16">Reconstructed workflow · Contractual knowledge is distinct from live operational performance.</text></svg>